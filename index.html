<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hyrox Coach</title>
  <meta name="description" content="Programme, saisie des séances et progression Hyrox.">
  <meta name="theme-color" content="#0e0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hyrox">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<body>
  <header class="top">
    <a href="#/today" class="logo">HYROX<span>coach</span></a>
    <div class="top-actions">
      <button id="refresh" class="icon" aria-label="Synchroniser">⟳</button>
      <a href="#/settings" class="icon" aria-label="Réglages">⚙︎</a>
    </div>
  </header>
  <div id="status" class="status"></div>
  <main id="view"></main>
  <nav class="tabs">
    <a href="#/today" data-tab="today"><span>●</span>Aujourd'hui</a>
    <a href="#/week" data-tab="week"><span>▦</span>Semaine</a>
    <a href="#/history" data-tab="history"><span>☰</span>Historique</a>
    <a href="#/progress" data-tab="progress"><span>↗</span>Progrès</a>
    <a href="#/goals" data-tab="goals"><span>◎</span>Objectifs</a>
  </nav>
  <div id="toast" class="toast"></div>

</html>
